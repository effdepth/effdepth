[project]
name = "effdepth"
version = "0.1.0"
description = "Effective depth of wide residual networks: kernel limits, spectra and generalization"
readme = "README.md"
requires-python = ">=3.10,<3.14"   # torch 2.6.0+cu124 has wheels for 3.9 to 3.13 only
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "mpmath>=1.3",
  "matplotlib>=3.8",
  "torch==2.6.0",
  "torchvision==0.21.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
